<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BLUE ARCHIVE</title>
<style>
  :root { --blue:#173b67; --pale:#edf4fb; --line:#cbd9e8; }
  * { box-sizing:border-box; }
  body { margin:0; padding:24px 16px 40px; font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif; background:var(--pale); color:var(--blue); }
  main { max-width:560px; margin:auto; background:white; border-radius:22px; padding:24px; box-shadow:0 8px 28px #18345a14; }
  .eyebrow { letter-spacing:.18em; font-size:12px; color:#6480a1; font-weight:700; }
  h1 { margin:8px 0; font-size:32px; }
  p { line-height:1.65; }
  .entry { display:flex; gap:8px; margin:22px 0 12px; }
  input { min-width:0; flex:1; border:1px solid var(--line); border-radius:12px; padding:13px; font-size:16px; text-transform:uppercase; }
  button { border:0; border-radius:12px; padding:13px 16px; font-size:15px; font-weight:700; background:var(--blue); color:white; cursor:pointer; }
  .hint { font-size:13px; color:#71839a; }
  #result { margin-top:22px; }
  #result img { width:100%; max-height:440px; object-fit:contain; background:#f6f8fb; border:1px solid #e5ebf2; border-radius:14px; }
  .result-card { border:1px solid var(--line); border-radius:16px; padding:16px; }
  .download { display:inline-block; margin-top:12px; padding:12px 16px; border-radius:12px; background:#e5eef8; color:var(--blue); font-weight:700; text-decoration:none; }
  .error { color:#a52a37; background:#fff0f1; padding:12px; border-radius:10px; }
  footer { text-align:center; color:#8a9bb0; font-size:12px; margin-top:20px; }
  @media(max-width:390px){ main{padding:18px} h1{font-size:27px} .entry{flex-direction:column} }
</style>
</head>
<body>
<main>
  <div class="eyebrow">INTERACTIVE ART PROJECT</div>
  <h1>BLUE ARCHIVE</h1>
  <p>그림 속에 숨겨진 코드를 입력해 보세요.<br>코드가 일치하면 숨겨진 넘버가 나타납니다.</p>
  <form class="entry" id="codeForm">
    <input id="codeInput" autocomplete="off" placeholder="예: BLUE-01" aria-label="숨겨진 코드">
    <button type="submit">완료</button>
  </form>
  <div class="hint">hint: 작품에 숨겨진 영문과 숫자를 확인하세요.</div>
  <section id="result" aria-live="polite"></section>
<button id="resetButton" type="button" hidden>
  돌아가기
</button>
  <footer>BLUE ARCHIVE · Find what the blue is hiding</footer>
</main>
<script>
/* 각 코드 오른쪽에 해당 이미지 파일명을 연결하세요. */
const artworks = {
  "K7V2Q": { file: "IMG_1.jpeg", title: "숨겨진 이미지 01" },
  "R4X8M": { file: "IMG_2.jpeg", title: "숨겨진 이미지 02" },
  "N6B3Z": { file: "IMG_3.jpeg", title: "숨겨진 이미지 03" },
  "T9W2L": { file: "IMG_4.jpeg", title: "숨겨진 이미지 04" },
  "C5J7P": { file: "IMG_5.jpeg", title: "숨겨진 이미지 05" },
  "H3F8Y": { file: "IMG_6.jpeg", title: "숨겨진 이미지 06" },
  "M2Q6D": { file: "IMG_7.jpeg", title: "숨겨진 이미지 07" },
  "V8L4S": { file: "IMG_8.jpeg", title: "숨겨진 이미지 08" },
  "X745N": { file: "IMG_9.jpeg", title: "숨겨진 이미지 09" }
};
const form = document.getElementById("codeForm");
const input = document.getElementById("codeInput");
  const resetButton = document.getElementById("resetButton");
resetButton.addEventListener("click", () => {
  result.replaceChildren();
  input.value = "";
  resetButton.hidden = true;
  input.focus();
});
form.addEventListener("submit", (event) => {
  event.preventDefault();
  const code = input.value.trim().toUpperCase();
  const item = artworks[code];
  result.replaceChildren();
  if (!item) {
    const error = document.createElement("p");
    error.className = "error";
    error.textContent = "코드가 일치하지 않아요. 그림을 다시 살펴보세요!";
    result.append(error);
    return;
  }
  const card = document.createElement("div");
  card.className = "result-card";
  const heading = document.createElement("h2");
  heading.textContent = "당신의 마음속 블루입니다.";
  const img = document.createElement("img");
  resetButton.hidden = false;
  img.src = item.file;
  img.alt = item.title;
  img.onerror = () => {
    img.style.display = "none";
    const note = document.createElement("p");
    note.textContent = "아직 이미지 파일을 넣지 않았어요. 폴더에 " + item.file + " 파일을 추가해 주세요.";
    card.append(note);
  };
card.append(heading, img);
  result.append(card);
});
</script>
</body>
</html>
